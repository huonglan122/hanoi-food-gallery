<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ẩm Thực Hà Nội - Trải Nghiệm Hương Vị Cổ Truyền</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Khám Phá Ẩm Thực Hà Nội</h1>
        <p>Thưởng thức nét văn hóa ẩm thực tinh tế và lâu đời của thủ đô qua từng món ăn truyền thống.</p>
    </header>

    <main class="grid-container">
        <figure>
            <img src="images/banh-com.jpg" alt="Đĩa bánh cốm xanh mướt gói lá sen thơm dẻo đặc sản Hà Nội">
            <figcaption>
                <h2>Bánh Cốm Hà Nội</h2>
                <p>Bánh cốm là món quà quê thanh nhã với màu xanh dịu mát, nhân đậu xanh ngọt ngào thơm lừng mùi lá sen đượm đà vị thu Hà Nội.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="images/banh-cuon.jpg" alt="Mẹt bánh cuốn nóng hổi đắc sắc kèm chả mỡ và nước mắm ớt">
            <figcaption>
                <h2>Bánh Cuốn Tráng Tay</h2>
                <p>Lớp bánh tráng mỏng dẻo ôm trọn nhân thịt mộc nhĩ thơm phức, ăn kèm hành phi giòn rụm và nước mắm chua ngọt ấm nóng.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="images/bun-cha.jpg" alt="Bát bún chả nướng than hoa thơm lừng cùng đĩa bún tươi và rau sống">
            <figcaption>
                <h2>Bún Chả Hà Nội</h2>
                <p>Chả miếng và chả viên được nướng xém cạnh trên than hồng, thả vào bát nước mắm chua ngọt đậm đà ăn kèm bún tươi và rau sống.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="images/bun-thang.jpg" alt="Tô bún thang Hà Nội được trình bày đẹp mắt với nhiều nguyên liệu chỉ nhỏ">
            <figcaption>
                <h2>Bún Thang Cổ Truyền</h2>
                <p>Món ăn cầu kỳ đòi hỏi sự tỉ mỉ với hàng chục nguyên liệu như trứng tráng mỏng, lườn gà xé, giò lụa thái chỉ và nước dùng trong ngọt.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="images/ca-phe-trung.jpg" alt="Cốc cà phê trứng béo ngậy phủ lớp kem bọt vàng ươm hấp dẫn">
            <figcaption>
                <h2>Cà Phê Trứng</h2>
                <p>Lớp kem trứng đánh bông mịn béo ngậy kết hợp hoàn hảo với vị cà phê phin đắng nhẹ đậm đà, tạo nên thức uống độc đáo nổi tiếng.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="images/cha-ca.jpg" alt="Chảo chả cá Lăng xào cùng thì là và hành hoa nghi ngút khói">
            <figcaption>
                <h2>Chả Cá Lăng</h2>
                <p>Cá lăng ướp riềng mẻ nướng vàng rồi xào trực tiếp trên chảo cùng hành hoa, thì là tươi, ăn kèm mắm tôm tỏi ớt đậm vị.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="images/pho-bo.jpg" alt="Bát phở bò tái chín thơm phức với nước dùng trong và nhiều hành lá">
            <figcaption>
                <h2>Phở Bò Gia Truyền</h2>
                <p>Món ăn quốc hồn quốc túy với nước dùng ninh từ xương bò ngọt thanh, bánh phở mềm dẻo cùng những lát thịt bò tươi ngon hảo hạng.</p>
            </figcaption>
        </figure>
    </main>

    <footer>
        <p>&copy; 2026 Trang web Ẩm Thực Hà Nội. Bài tập dự án môn Advanced Styling with Responsive Design.</p>
    </footer>
</body>
</html>
